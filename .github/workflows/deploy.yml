name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mintlify CLI
        run: npm install -g mintlify

      - name: Export static site
        working-directory: docs
        run: mintlify export --output ../site.zip

      - name: Unpack export
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site

      - name: Fix group index pages
        run: |
          # mintlify export writes a group's own "index" page (e.g. getting-started/index)
          # to getting-started/index/index.html instead of getting-started/index.html,
          # which breaks the URL the group's own link (e.g. /getting-started/) resolves to.
          find _site -type d -name index -path '*/index' | while read -r dir; do
            parent="$(dirname "$dir")"
            if [ -f "$dir/index.html" ] && [ "$parent" != "_site" ]; then
              mv "$dir/index.html" "$parent/index.html"
              rm -rf "$dir"
            fi
          done

      - name: Preserve custom domain
        run: cp docs/CNAME _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
