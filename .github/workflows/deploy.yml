name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mintlify CLI
        run: npm install -g mintlify

      - name: Export static site
        working-directory: docs
        run: mintlify export --output ../site.zip

      - name: Unpack export
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site

      - name: Rewrite absolute paths for the /ArchTect/ subpath
        run: |
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' \) -print0 \
            | xargs -0 sed -i \
                -e 's#\(href\|src\)="/#\1="/ArchTect/#g' \
                -e 's#url(/#url(/ArchTect/#g' \
                -e 's#"/_next/#"/ArchTect/_next/#g'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
