<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160">
  <!-- HEX CLUSTER: original artwork's rendered bbox is x:[67.5,444.5] y:[67.8,444.8] (377x377) within a 512x512 viewBox.
       Scale that 377px box to 140px tall and place it flush-left, vertically centered in this 160-tall canvas. -->
  <g transform="translate(10,10) scale(0.3713)">
    <g transform="translate(-67.5,-67.8)">
      <!-- connectors -->
      <g fill="none" stroke="#374151" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
        <line x1="226" y1="202.5" x2="216" y2="217.5" transform="translate(256,323) scale(1.45) translate(-256,-256)"/>
        <line x1="286" y1="202.5" x2="296" y2="217.5" transform="translate(256,323) scale(1.45) translate(-256,-256)"/>
        <line x1="246" y1="270" x2="266" y2="270" transform="translate(256,323) scale(1.45) translate(-256,-256)"/>
      </g>

      <g transform="translate(256,323) scale(1.45) translate(-256,-256)">
        <!-- Top hex -->
        <g>
          <polygon fill="#6B7280" points="256,80 316,115 316,185 256,220 196,185 196,115"/>
          <polygon fill="#8B949E" points="256,80 196,115 196,185 256,150"/>
          <polygon fill="#4B5563" points="256,150 316,185 256,220 256,150"/>
        </g>

        <!-- Left hex -->
        <g>
          <polygon fill="#6B7280" points="186,200 246,235 246,305 186,340 126,305 126,235"/>
          <polygon fill="#8B949E" points="186,200 126,235 126,305 186,270"/>
          <polygon fill="#4B5563" points="186,270 246,305 186,340 186,270"/>
        </g>

        <!-- Right hex -->
        <g>
          <polygon fill="#E11D48" points="326,200 386,235 386,305 326,340 266,305 266,235"/>
          <polygon fill="#FB3B63" points="326,200 266,235 266,305 326,270"/>
          <polygon fill="#B31233" points="326,270 386,305 326,340 326,270"/>
        </g>
      </g>
    </g>
  </g>

  <!-- WORDMARK, vertically centered next to the logo -->
  <g font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
     font-size="76" font-weight="700" letter-spacing="0.5">
    <text x="172" y="106" text-anchor="start" fill="#6B7280">Arch</text><text x="342" y="106" text-anchor="start" fill="#E11D48">Tect</text>
  </g>
</svg>
